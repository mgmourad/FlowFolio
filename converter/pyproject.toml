[project]
name = "flowfolio-converter"
version = "0.1.0"
description = "FlowFolio PDF to reflowable EPUB 3 conversion service"
readme = "README.md"
license = "MIT"
authors = [{ name = "The FlowFolio Authors" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flowfolio-convert = "flowfolio_converter.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
