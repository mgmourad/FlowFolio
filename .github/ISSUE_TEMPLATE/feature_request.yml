name: Idea
description: Something FlowFolio could do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The reading problem, rather than the solution. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. If you already have a shape in mind, describe it.
