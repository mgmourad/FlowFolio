# Local development stack. Run from repo root:
#   docker compose -f infra/docker/compose.dev.yml up --build
services:
  converter:
    build:
      context: ../../converter
    image: flowfolio-converter:dev
    ports:
      - "8000:8000"
    environment:
      FLOWFOLIO_ENVIRONMENT: dev
    volumes:
      - converter-data:/data

volumes:
  converter-data:
