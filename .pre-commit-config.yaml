# Install once:  uv tool install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on all files:  pre-commit run --all-files
# detekt and Android Lint are too slow for a commit hook; they run in CI (ADR-0008).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: ^android/core/database/schemas/  # generated by Room without a final newline
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Four things are committed large on purpose. Generated baseline profiles are about 2 MB of text each and
        # git compresses them well; the ambient recordings are the owner's own, already down to mono 64 kbps, and
        # have to ship inside the app for Reading Atmosphere to play offline; the demo book is one CC BY OpenStax
        # chapter (about 4 MB) that a first launch opens with. WordNet is a download since TM2 and no longer
        # committed. The limit still guards everything else -- corpus PDFs above all, which are never committed.
        exclude: ^(android/app/src/release/generated/baselineProfiles/|android/core/data/src/main/res/raw/|android/app/src/main/assets/demo/)
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=no]
        exclude: \.(bat|cmd|ps1)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (tools)
        entry: uvx ruff@0.17.1 check --fix --line-length 120
        language: system
        types: [python]
        files: ^tools/
      - id: ruff-format
        name: ruff format (tools)
        entry: uvx ruff@0.17.1 format --line-length 120
        language: system
        types: [python]
        files: ^tools/
      - id: ktlint
        name: ktlint via spotless (android)
        entry: python infra/ci/gradle.py spotlessCheck --quiet
        language: system
        files: ^android/.*\.kts?$
        pass_filenames: false
